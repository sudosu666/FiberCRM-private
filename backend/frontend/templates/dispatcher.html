<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiberOps Dispatcher</title>
  <link rel="stylesheet" href="/static/dispatcher.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">FiberOps CRM</p>
      <h1>Панель диспетчера</h1>
    </div>
    <nav class="role-nav">
      <a class="active" href="/dispatcher">Диспетчер</a>
      <a href="/field">Робочі</a>
      <a href="/warehouse">Склад</a>
    </nav>
  </header>

  <main class="layout">
    <section class="card">
      <div class="card-head">
        <h2>Задачі</h2>
        <button id="refreshTasks" type="button">Оновити</button>
      </div>
      <div id="tasksList" class="stack">
        <p class="placeholder">Завантаження задач...</p>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Бригади</h2>
        <span id="brigadesCounter" class="meta">0</span>
      </div>
      <div id="brigadesList" class="stack">
        <p class="placeholder">Завантаження бригад...</p>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Таймлайн</h2>
        <span id="socketState" class="meta warn">Socket: polling</span>
      </div>
      <div id="timelineList" class="stack">
        <p class="placeholder">Завантаження таймлайна...</p>
      </div>
      <div class="card-head events-head">
        <h2>Події / Чат</h2>
      </div>
      <div id="eventFeed" class="stack events">
        <p class="placeholder">Очікування подій...</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/dispatcher.js"></script>
</body>
</html>
