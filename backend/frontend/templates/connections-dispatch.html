<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiberOps Connection Dispatch</title>
  <link rel="stylesheet" href="/static/dispatcher.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">FiberOps CRM</p>
      <h1>Диспетчер підключень</h1>
    </div>
    <div class="topbar-side">
      <nav class="role-nav">
        <a href="/dispatcher">Будівництво</a>
        <a class="active" href="/connections-dispatch">Підключення</a>
        <a href="/field">Робочі</a>
      </nav>
      <div class="auth-box">
        <div>
          <p id="authUserName" class="auth-name">Гість</p>
          <p id="authUserRole" class="auth-role">Без авторизації</p>
        </div>
        <a id="authLoginLink" href="/login">Login</a>
        <button id="authLogoutButton" type="button" hidden>Logout</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card card-wide">
      <div class="card-head">
        <h2>Оперативна зведена</h2>
      </div>
      <div id="connectionSummary" class="stats-grid">
        <p class="placeholder">Завантаження...</p>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Нова заявка</h2>
      </div>
      <div class="stack">
        <select id="requestBuilding"></select>
        <input id="requestFlat" type="number" min="1" placeholder="Квартира">
        <input id="requestCustomer" type="text" placeholder="ПІБ клієнта">
        <input id="requestPhone" type="text" placeholder="Телефон">
        <textarea id="requestNote" rows="3" placeholder="Примітка"></textarea>
        <button id="createSubscriberRequest" type="button">Створити заявку</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Призначення</h2>
      </div>
      <div class="stack">
        <select id="scheduleRequest"></select>
        <select id="scheduleUser"></select>
        <input id="scheduleDate" type="date">
        <select id="scheduleWindow">
          <option value="before_lunch">До обіду</option>
          <option value="after_lunch">Після обіду</option>
        </select>
        <button id="scheduleSubscriberRequest" type="button">Призначити виїзд</button>
      </div>
      <div class="stack" style="margin-top:12px;">
        <input id="postponeSubscriberReason" type="text" placeholder="Причина переносу заявки">
        <button id="postponeSubscriberRequest" type="button">Перенести</button>
      </div>
    </section>

    <section class="card card-wide">
      <div class="card-head">
        <h2>Черга заявок</h2>
        <button id="refreshSubscriberRequests" type="button">Оновити</button>
      </div>
      <div id="subscriberRequestsList" class="stack">
        <p class="placeholder">Завантаження заявок...</p>
      </div>
    </section>
  </main>

  <script src="/static/auth.js"></script>
  <script src="/static/connections-dispatch.js"></script>
</body>
</html>
