name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fiber
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fibercrm
        options: >-
          --health-cmd "pg_isready -U fiber"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Static checks
        run: python -m compileall backend/app
      - name: Docker compose config
        run: docker compose config
        env:
          DATABASE_URL: postgresql+asyncpg://fiber:password@localhost:5432/fibercrm
