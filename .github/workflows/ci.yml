name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_ENV: dev
  JWT_SECRET: ci-local-secret
  CORS_ALLOW_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  POSTGRES_DB: fibercrm
  POSTGRES_USER: fiber
  POSTGRES_PASSWORD: fiberpass
  DATABASE_URL: postgresql+asyncpg://fiber:fiberpass@127.0.0.1:5432/fibercrm
  E2E_BASE_URL: http://127.0.0.1:8000

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Static validation
        run: |
          python -m compileall backend/app tests/e2e
          python -m py_compile frontend/preview_server.py
          bash -n scripts/dev-run.sh
          bash -n scripts/run_e2e.sh
      - name: Compose config
        run: docker compose config

  e2e-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fibercrm
          POSTGRES_USER: fiber
          POSTGRES_PASSWORD: fiberpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiber -d fibercrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Start backend
        run: |
          mkdir -p logs
          nohup python -m uvicorn app.main:sio_app --host 127.0.0.1 --port 8000 > logs/backend-ci.log 2>&1 &
        working-directory: backend
      - name: Wait for readiness
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health/ready"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          raise SystemExit("backend did not become ready")
          PY
      - name: Run API, realtime, and ops tests
        run: pytest -q tests/e2e/api tests/e2e/realtime tests/e2e/ops
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: logs/backend-ci.log

  e2e-ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fibercrm
          POSTGRES_USER: fiber
          POSTGRES_PASSWORD: fiberpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiber -d fibercrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Start backend
        run: |
          mkdir -p logs
          nohup python -m uvicorn app.main:sio_app --host 127.0.0.1 --port 8000 > logs/backend-ui.log 2>&1 &
        working-directory: backend
      - name: Wait for readiness
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health/ready"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          raise SystemExit("backend did not become ready")
          PY
      - name: Run UI tests
        run: pytest -q tests/e2e/ui
      - name: Upload UI backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ui-log
          path: logs/backend-ui.log

  https-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up -d --build db redis backend nginx
        env:
          APP_ENV: dev
          JWT_SECRET: ci-local-secret
          CORS_ALLOW_ORIGINS: https://localhost:8443,http://127.0.0.1:8000
          POSTGRES_DB: fibercrm
          POSTGRES_USER: fiber
          POSTGRES_PASSWORD: fiberpass
          BACKEND_DATABASE_URL: postgresql+asyncpg://fiber:fiberpass@db:5432/fibercrm
          REDIS_URL: redis://redis:6379/0
      - name: Wait for HTTPS readiness
        run: |
          python - <<'PY'
          import ssl
          import sys
          import time
          import urllib.request

          ssl._create_default_https_context = ssl._create_unverified_context
          url = "https://localhost:8443/health/ready"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          raise SystemExit("https endpoint did not become ready")
          PY
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down -v
