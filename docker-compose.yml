services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fiber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiberpass}
      POSTGRES_DB: ${POSTGRES_DB:-fibercrm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiber} -d ${POSTGRES_DB:-fibercrm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_RELEASE: ${APP_RELEASE:-local-dev}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://fiber:fiberpass@db:5432/fibercrm}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      SQL_ECHO: ${SQL_ECHO:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-10}
      RATE_LIMIT_REPORT_PER_MINUTE: ${RATE_LIMIT_REPORT_PER_MINUTE:-20}
      RATE_LIMIT_REALTIME_PER_MINUTE: ${RATE_LIMIT_REALTIME_PER_MINUTE:-120}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend/app:/app/app:delegated
      - ./frontend/app:/app/frontend:delegated
      - ./tests:/app/tests:delegated
      - ./pytest.ini:/app/pytest.ini:ro
      - ./scripts:/app/scripts:ro
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
    command: ["uvicorn", "app.main:sio_app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25
    depends_on:
      - backend
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      TZ: UTC

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      if [ -n "$NGROK_DOMAIN" ]; then
        ngrok http backend:8000 --domain="$NGROK_DOMAIN";
      else
        ngrok http backend:8000;
      fi
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

volumes:
  db_data:
  redis_data:
