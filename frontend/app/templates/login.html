<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Увійти — FiberOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/main.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
  .login-card { width: 360px; padding: 40px; text-align: center; background: var(--surface-glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 4px; margin-bottom: 8px; }
  .subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
  .error-box { margin-bottom: 20px; padding: 10px; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); font-size: 12px; border-radius: 6px; display: none; }
</style>
</head>
<body>

<div class="login-card animate-in">
  <div class="logo">FiberOps</div>
  <div class="subtitle">Unified CRM & Fiber Design</div>
  
  <div id="error-box" class="error-box">Невірний логін або пароль</div>

  <form id="loginForm" class="flex-col">
    <div class="field">
      <label>Логін</label>
      <input type="text" id="username" placeholder="alex_pro" required autofocus>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top: 10px; width:100%">Увійти в систему</button>
  </form>
  
  <p style="margin-top: 24px; font-size: 11px; color: var(--text-muted)">Магістраль: Доступна (UKR-12)</p>
</div>

<script src="/static/auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error-box');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });

        if (res.ok) {
            const data = await res.json();
            window.localStorage.setItem('fiberops_token', data.token);
            window.localStorage.setItem('fiberops_user', JSON.stringify(data.user));
            // Redirect based on role
            const role = data.user.role;
            if (role === 'Designer') window.location.href = '/designer';
            else if (role === 'Dispatcher') window.location.href = '/dispatcher';
            else window.location.href = '/dispatcher';
        } else {
            errorBox.style.display = 'block';
        }
    } catch (err) {
        errorBox.textContent = 'Помилка мережі';
        errorBox.style.display = 'block';
    }
  });

  // Check if already logged in
  if (window.localStorage.getItem('fiberops_token')) {
    // maybe auto redirect?
  }
</script>
</body>
</html>
