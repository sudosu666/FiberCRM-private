<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстр — FiberOps</title>
<link rel="stylesheet" href="/static/main.css">
<style>
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px 16px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:hover td { background: var(--surface-light); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-inject"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="flex-row" style="flex:1">
        <span class="badge badge-success">Реєстр</span>
        <h2 style="font-size: 14px; margin-left: 10px;">Реєстр інфраструктури</h2>
      </div>
      <div class="flex-row">
        <span id="totalCount" class="badge">0 об'єктів</span>
        <div id="authUserName" style="font-size: 12px; color: var(--text-secondary)"></div>
      </div>
    </header>

    <div class="main-content">
      <div class="card p-0">
        <table id="regTable">
          <thead>
            <tr>
              <th>Місто</th>
              <th>Адреса</th>
              <th>Параметри</th>
              <th>Статус мережі</th>
              <th>Тендер ID</th>
            </tr>
          </thead>
          <tbody id="regBody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-muted)">Завантаження даних...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/registry.js"></script>
<script src="/static/sidebar.js"></script>
</body>
</html>
