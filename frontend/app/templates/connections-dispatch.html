<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiberOps — Підключення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/main.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-inject"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="flex-row" style="flex:1">
        <span class="badge badge-success">Підключення</span>
        <h2 style="font-size: 14px; margin-left: 10px;">Абонентський відділ</h2>
      </div>
      <div class="flex-row">
        <div id="authUserName" style="font-size: 12px; color: var(--text-secondary)"></div>
        <div id="authUserRole" style="font-size: 12px; color: var(--text-muted)"></div>
        <button class="btn btn-ghost btn-sm" id="authLogoutButton" hidden>Вийти</button>
        <a class="btn btn-primary btn-sm" id="authLoginLink" href="/login">Увійти</a>
        <button class="btn btn-primary btn-sm" id="refreshSubscriberRequests">Оновити</button>
      </div>
    </header>

    <div class="main-content">
      <div class="grid-3">
        <!-- New Request Form -->
        <div class="flex-col">
          <div class="card">
            <div class="card-header"><span class="card-title">Нова заявка</span></div>
            <div class="field"><label>Будинок</label><select id="requestBuilding"></select></div>
            <div class="field"><label>Квартира</label><input id="requestFlat" type="number" placeholder="№"></div>
            <div class="field"><label>Клієнт</label><input id="requestCustomer" type="text" placeholder="ПІБ"></div>
            <div class="field"><label>Телефон</label><input id="requestPhone" type="text" placeholder="+380..."></div>
            <div class="field"><label>Примітка</label><textarea id="requestNote" rows="2"></textarea></div>
            <button class="btn btn-primary btn-sm" id="createSubscriberRequest">Створити</button>
          </div>
          
          <div class="card">
            <div class="card-header"><span class="card-title">Зведення</span></div>
            <div id="connectionSummary"></div>
          </div>
        </div>

        <!-- Middle: Queue -->
        <div class="flex-col" style="grid-column: span 2">
          <div class="card">
            <div class="card-header"><span class="card-title">Черга заявок</span></div>
            <div id="subscriberRequestsList" class="flex-col"></div>
          </div>

          <div class="card" id="scheduleCard" style="display:none">
            <div class="card-header"><span class="card-title">Призначення виїзду</span></div>
            <div class="grid-2">
               <div class="field"><label>Заявка</label><select id="scheduleRequest" disabled></select></div>
               <div class="field"><label>Монтажник</label><select id="scheduleUser"></select></div>
            </div>
            <div class="grid-2">
               <div class="field"><label>Дата</label><input id="scheduleDate" type="date"></div>
               <div class="field">
                  <label>Вікно</label>
                  <select id="scheduleWindow">
                    <option value="morning">До обіду</option>
                    <option value="afternoon">Після обіду</option>
                  </select>
               </div>
            </div>
            <button class="btn btn-primary btn-sm" id="scheduleSubscriberRequest">Підтвердити</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/connections-dispatch.js"></script>
<script src="/static/sidebar.js"></script>
</body>
</html>
