include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - ui
  - build
  - deploy

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  AST_ENABLE_MR_PIPELINES: "true"
  APP_ENV: dev
  JWT_SECRET: ci-local-secret
  CORS_ALLOW_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  POSTGRES_DB: fibercrm
  POSTGRES_USER: fiber
  POSTGRES_PASSWORD: fiberpass
  DATABASE_URL: postgresql+asyncpg://fiber:fiberpass@postgres:5432/fibercrm
  E2E_BASE_URL: http://127.0.0.1:8000
  PYTHONUNBUFFERED: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

validate:
  stage: validate
  image: python:3.11-slim
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - python -m compileall backend/app tests/e2e
    - python -m py_compile frontend/preview_server.py
    - bash -n scripts/dev-run.sh
    - bash -n scripts/run_e2e.sh

e2e_api:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - mkdir -p logs
    - cd backend && nohup python -m uvicorn app.main:sio_app --host 127.0.0.1 --port 8000 > ../logs/backend-api.log 2>&1 &
    - cd ..
    - |
      python - <<'PY'
      import sys
      import time
      import urllib.request

      url = "http://127.0.0.1:8000/health/ready"
      for _ in range(60):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  if response.status == 200:
                      sys.exit(0)
          except Exception:
              pass
          time.sleep(2)
      raise SystemExit("backend did not become ready")
      PY
    - pytest -q tests/e2e/api tests/e2e/realtime tests/e2e/ops --junitxml=junit-api.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit-api.xml
    paths:
      - logs/backend-api.log

e2e_ui:
  stage: ui
  image: mcr.microsoft.com/playwright/python:v1.58.0-jammy
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - mkdir -p logs
    - cd backend && nohup python -m uvicorn app.main:sio_app --host 127.0.0.1 --port 8000 > ../logs/backend-ui.log 2>&1 &
    - cd ..
    - |
      python - <<'PY'
      import sys
      import time
      import urllib.request

      url = "http://127.0.0.1:8000/health/ready"
      for _ in range(60):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  if response.status == 200:
                      sys.exit(0)
          except Exception:
              pass
          time.sleep(2)
      raise SystemExit("backend did not become ready")
      PY
    - python -m playwright install chromium
    - pytest -q tests/e2e/ui --junitxml=junit-ui.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit-ui.xml
    paths:
      - logs/backend-ui.log

docker_build:
  stage: build
  image: docker:24.0.2-cli
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f backend/Dockerfile -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

production_deploy_placeholder:
  stage: deploy
  script:
    - echo "Add your production deployment command here (SSH/Helm/K8s)."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
