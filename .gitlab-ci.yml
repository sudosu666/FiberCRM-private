include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  AST_ENABLE_MR_PIPELINES: "true"
  POSTGRES_DB: fibercrm
  POSTGRES_USER: fiber
  POSTGRES_PASSWORD: fiberpass
  DATABASE_URL: postgresql+asyncpg://fiber:fiberpass@postgres:5432/fibercrm

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

backend_smoke:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - python -m compileall backend/app
    - pytest -q tests/e2e/ops --junitxml=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
docker_build:
  stage: build
  image: docker:24.0.2-cli
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f backend/Dockerfile -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

production_deploy_placeholder:
  stage: deploy
  script:
    - echo "Add your production deployment command here (SSH/Helm/K8s)."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
